[project]
name = "kibo-rpc"
version = "0.0.0"
description = "7th Kibo Robot Programming Challenge: Int-Ball2 mission logic"
requires-python = ">=3.8"
dependencies = []

[dependency-groups]
dev = [
    "numpy>=1.24.4",
    "opencv-contrib-python-headless>=5.0.0.93",
    "pyright>=1.1.414",
    "pytest>=8.3.5",
    "ruff>=0.17.3",
    "vermin>=1.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kibo"]

[tool.ruff]
line-length = 100
target-version = "py37"
src = ["src", "tests"]
# krpc_user/ 的範本是官方檔案，照原樣保留（方便日後與新版比對），不套我們的格式。
extend-exclude = ["krpc_user/scripts/user_template.py"]

[tool.ruff.lint]
# UP 系列會把語法升到 3.7 以後，執行環境是 3.6，所以不啟用。
select = ["E", "F", "I", "B"]

[tool.pyright]
include = ["src", "tests", "ros"]
extraPaths = ["src"]
# ros/ 的 rospy 等套件本機沒有；關掉「找不到 import」，其餘（例如呼叫了沒定義的方法）照查。
reportMissingImports = false
reportMissingModuleSource = false
pythonVersion = "3.8"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
